services:

  postgres:
    image: postgres:17-alpine
    container_name: institute-postgres

    environment:
      POSTGRES_DB: institute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d institute"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: institute-backend:1.0
    container_name: institute-backend

    environment:
      APP_ENV: development

      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080

      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: institute

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: institute-frontend:1.0
    container_name: institute-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  postgres_data: